backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Main Website Content"
        name: "home"
        format: "raw" 
        fields:
          - {label: "Website Code", name: "body", widget: "text"}
